---
# Lab 11: Copy boilerplate JCL into the library, tailor it in place with
# zos_replace, then submit it and report the result.
- name: Tailor boilerplate JCL and submit it
  hosts: mainframe
  gather_facts: false
  environment: "{{ environment_vars }}"

  tasks:
    # --- Step 1: copy the boilerplate in, without touching the rest of the PDSE
    - name: Make sure the JCL library exists
      ibm.ibm_zos_core.zos_data_set:
        name: "{{ hlq }}.LAB.JCL"
        type: library
        record_format: fb
        record_length: 80
        block_size: 32000
        space_primary: 1
        space_secondary: 1
        space_type: trk
        state: present

    - name: Copy the boilerplate into member TEXTOUT
      ibm.ibm_zos_core.zos_copy:
        src: jcl/TEXTOUT.jcl
        dest: "{{ hlq }}.LAB.JCL(TEXTOUT)"
        replace: true
        encoding:
          from: ISO8859-1
          to: IBM-1047

    # --- Step 2: tailor it in place
    - name: Replace the placeholder userid with the student TSO id
      ibm.ibm_zos_core.zos_replace:
        target: "{{ hlq }}.LAB.JCL(TEXTOUT)"
        regexp: 'PLACEHLD'
        replace: "{{ student_id }}"
        literal: regexp

    - name: Replace the boilerplate text
      ibm.ibm_zos_core.zos_replace:
        target: "{{ hlq }}.LAB.JCL(TEXTOUT)"
        regexp: 'OLD TEXT'
        replace: 'NEW AND IMPROVED TEXT'
        literal: regexp

    # --- Step 3: submit and report
    - name: Submit the tailored job
      ibm.ibm_zos_core.zos_job_submit:
        src: "{{ hlq }}.LAB.JCL(TEXTOUT)"
        remote_src: true
        wait_time: 60
        max_rc: 4
        return_output: true
      register: job

    - name: Fail on anything worse than a warning
      ansible.builtin.assert:
        that:
          - job.jobs[0].ret_code.code <= 4
        fail_msg: "RC {{ job.jobs[0].ret_code.code }} from {{ job.jobs[0].job_name }}"

    - name: Show the tailored output
      ansible.builtin.debug:
        msg: "{{ (job.jobs[0].dds | selectattr('dd_name', 'equalto', 'SYSUT2') | first).content | default('SYSUT2 not returned') }}"
