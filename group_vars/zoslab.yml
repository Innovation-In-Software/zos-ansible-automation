---
## group_vars/zoslab.yml
#
# Toolchain for the ibm_zos_core 1.9.0 execution environment test.
#
#   1.9.0 predates the ZOAU 1.4 API change, so it needs the OLDER ZOAU tree at
#   /usr/lpp/IBM/zoautil (1.2.5.4), not /usr/lpp/IBM/zoau/v1r4 that the 1.15.0
#   lab playbooks use. zoautil_py 1.2.5.4 is already in the Python 3.11
#   site-packages on the LPAR, so PYTHONPATH is not needed here.
#
#   These values deliberately shadow group_vars/all.yml for hosts in zoslab.
PYZ_19: "/usr/lpp/IBM/cyp/v3r11/pyz"
ZOAU_19: "/usr/lpp/IBM/zoautil"

environment_vars:
  _BPXK_AUTOCVT: "ON"
  ZOAU_HOME: "{{ ZOAU_19 }}"
  LIBPATH: "{{ ZOAU_19 }}/lib:{{ PYZ_19 }}/lib:/lib:/usr/lib:."
  PATH: "{{ ZOAU_19 }}/bin:{{ PYZ_19 }}/bin:/bin:/var/bin"
  PYTHONSTDINENCODING: "cp1047"
  _CEE_RUNOPTS: "FILETAG(AUTOCVT,AUTOTAG) POSIX(ON)"
  _TAG_REDIR_IN: txt
  _TAG_REDIR_OUT: txt
  _TAG_REDIR_ERR: txt
